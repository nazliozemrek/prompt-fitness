<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Prompt Fitness</title>
<link rel="stylesheet" href="popup.css">
<script src="popup.js" defer></script>
</head>
<body>
  <header class="head">
    <img src="icons/icon-48.png" width="28" height="28" alt="">
    <div>
      <h1>Prompt Fitness</h1>
      <p class="sub">Today, on this device</p>
    </div>
  </header>

  <section class="hero" aria-live="polite">
    <p class="big"><span id="water">0</span> <span id="waterUnit" class="unit">mL</span></p>
    <div class="bar" role="progressbar" aria-label="Daily water budget used" aria-valuemin="0" aria-valuemax="100" id="bar"><span id="barFill"></span></div>
    <p class="meta"><span id="budgetText">of 1.0 L daily budget</span></p>
    <dl class="stats">
      <div><dt>Prompts</dt><dd id="count">0</dd></div>
      <div><dt>Avg score</dt><dd id="avg">–</dd></div>
      <div><dt>Eco-Fitness</dt><dd id="fitness">–</dd></div>
    </dl>
  </section>

  <section class="card" id="lastCard" hidden>
    <p class="label">Last reply</p>
    <p id="lastText" class="value"></p>
  </section>

  <section class="card" id="siteCard">
    <p class="label" id="siteLabel">This site</p>
    <div id="siteControls" hidden>
      <label class="row" for="pauseToggle">
        <span>Track on <b id="siteHost"></b></span>
        <input type="checkbox" id="pauseToggle" role="switch" checked>
      </label>
      <label class="row" for="siteModel">
        <span>Model used here</span>
        <select id="siteModel"></select>
      </label>
    </div>
    <p id="siteHint" class="hint">Open ChatGPT, Claude or Gemini to change settings for that site.</p>
  </section>

  <section class="card">
    <label class="row" for="pillToggle">
      <span>Show on-page indicator</span>
      <input type="checkbox" id="pillToggle" role="switch" checked>
    </label>
    <label class="row" for="budget">
      <span>Daily water budget</span>
      <select id="budget">
        <option value="0.5">0.5 L</option>
        <option value="1">1 L</option>
        <option value="2">2 L</option>
        <option value="3">3 L</option>
      </select>
    </label>
  </section>

  <footer class="foot">
    <p class="hint" id="appHint">Estimates only. Message text is never stored or sent; only numbers are kept.</p>
    <button type="button" id="clearBtn" class="danger">Clear tracked data</button>
  </footer>
</body>
</html>
