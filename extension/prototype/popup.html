<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Fitness</title>
  <script src="chart.js"></script>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h2 {
      font-size: 16px;
      margin: 0;
      color: #38bdf8;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #334155;
    }
    .stat-label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
    }
    .stat-value {
      font-size: 18px;
      font-weight: bold;
      color: #f8fafc;
      margin-top: 4px;
    }
    .chart-container {
      background: #1e293b;
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #334155;
      margin-bottom: 16px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: none;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-export {
      background: #0284c7;
      color: white;
    }
    .btn-reset {
      background: #334155;
      color: #94a3b8;
    }
    button:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Prompt Fitness</h2>
    <span style="font-size: 11px; color: #22c55e; font-weight: 600;">● Live On-Device</span>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Toplam Prompt</div>
      <div class="stat-value" id="total-prompts">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Ort. Fitness</div>
      <div class="stat-value" id="avg-grade" style="color: #22c55e;">A</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Tahmini Su</div>
      <div class="stat-value" id="total-water">0 ml</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Tahmini Enerji</div>
      <div class="stat-value" id="total-energy">0 Wh</div>
    </div>
  </div>

  <div class="chart-container">
    <canvas id="usageChart" height="140"></canvas>
  </div>

  <div class="btn-group">
    <button class="btn-export" id="btn-export">Verileri İndir (JSON)</button>
    <button class="btn-reset" id="btn-reset">Sıfırla</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
